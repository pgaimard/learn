# Complément de développement : publie la base sur l'hôte, en boucle locale uniquement,
# pour lancer l'API, les tests et les migrations hors Docker.
# Activation : COMPOSE_FILE=compose.yaml:compose.dev.yaml dans .env (voir .env.example).
services:
  db:
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
