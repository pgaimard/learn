<div class="sticky">
  <ng-content />
  @if (view.editor(); as editor) {
    <app-editor-toolbar [editor]="editor" (imagePicked)="imageAdded.emit($event)" />
  }
</div>

<div class="sheet">
  <app-course-content
    #view
    [content]="content()"
    [label]="label()"
    [editable]="true"
    (edited)="edited.emit()"
    (imageReceived)="imageAdded.emit($event)"
  />
  @if (view.blockMenu(); as target) {
    @if (view.editor(); as editor) {
      <app-block-menu
        [editor]="editor"
        [pos]="target.pos"
        [style.top.px]="target.top"
        (closed)="view.blockMenu.set(null)"
      />
    }
  }
</div>
