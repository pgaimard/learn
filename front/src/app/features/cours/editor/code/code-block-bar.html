<app-dropdown
  compact
  searchable
  monospace
  label="Langage du bloc de code"
  searchLabel="Chercher un langage"
  [returnFocus]="false"
  [options]="languages"
  [value]="language()"
  (valueChange)="setLanguage($event)"
/>
<span class="meta name">Bloc de code</span>
<button type="button" class="tool" (click)="copy()">{{ copied() ? 'Copié' : 'Copier' }}</button>
