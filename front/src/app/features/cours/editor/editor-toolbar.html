<div class="toolbar" role="toolbar" aria-label="Blocs et insertions">
  <div class="group">
    <select aria-label="Style du bloc" [value]="blockStyle()" (change)="setBlockStyle($event)">
      <option value="paragraph">Paragraphe</option>
      <option value="h2">Section</option>
      <option value="h3">Sous-section</option>
      <option value="h4">Sous-sous-section</option>
      <option value="h5">Point</option>
    </select>
  </div>

  <div class="group">
    <button
      type="button"
      class="tool"
      title="Liste à puces"
      [attr.aria-pressed]="isActive('bulletList')"
      (click)="run(toggleBulletList)"
    >
      • Liste
    </button>
    <button
      type="button"
      class="tool"
      title="Liste numérotée"
      [attr.aria-pressed]="isActive('orderedList')"
      (click)="run(toggleOrderedList)"
    >
      1. Liste
    </button>
    <button
      type="button"
      class="tool"
      title="Citation"
      [attr.aria-pressed]="isActive('blockquote')"
      (click)="run(toggleBlockquote)"
    >
      Citation
    </button>
    <button
      type="button"
      class="tool"
      title="Bloc de code"
      [attr.aria-pressed]="isActive('codeBlock')"
      (click)="run(toggleCodeBlock)"
    >
      Bloc de code
    </button>
    <button type="button" class="tool" title="Insérer un tableau" (click)="insertTable()">
      Tableau
    </button>
    <button type="button" class="tool" title="Ligne de séparation" (click)="run(insertRule)">
      Séparateur
    </button>
    <label class="tool file" title="Insérer une image (PNG, JPEG ou SVG)">
      Image
      <input
        type="file"
        accept="image/png,image/jpeg,image/svg+xml"
        multiple
        class="visually-hidden"
        (change)="pickImage($event)"
      />
    </label>
  </div>

  <div class="group" role="group" aria-label="Encadré">
    @for (kind of calloutKinds; track kind) {
      <button
        type="button"
        class="tool"
        [title]="'Encadré « ' + calloutLabels[kind] + ' »'"
        [attr.aria-pressed]="isActive('callout', { kind })"
        (click)="toggleCallout(kind)"
      >
        {{ calloutLabels[kind] }}
      </button>
    }
  </div>

  <div class="group">
    <button type="button" class="tool" title="Annuler (Ctrl+Z)" (click)="run(undo)">Annuler</button>
    <button type="button" class="tool" title="Rétablir (Ctrl+Maj+Z)" (click)="run(redo)">
      Rétablir
    </button>
  </div>

  @if (isActive('figure')) {
    <div class="group context" role="group" aria-label="Image">
      <button type="button" class="tool" (click)="editAlternativeText()">Texte alternatif</button>
      <button type="button" class="tool danger" (click)="run(deleteFigure)">
        Supprimer l’image
      </button>
    </div>
  }
</div>
