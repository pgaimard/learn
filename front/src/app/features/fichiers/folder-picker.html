<dialog #dialog class="modal" aria-labelledby="folder-picker-title" (close)="closed.emit()">
  <div class="modal-header">
    <h2 id="folder-picker-title">Déplacer « {{ fileName() }} »</h2>
    <button
      type="button"
      class="button button-icon button-ghost"
      aria-label="Fermer la fenêtre"
      (click)="close()"
    >
      <app-icon name="close" [size]="15" />
    </button>
  </div>

  <div class="modal-body">
    <ul class="tree" aria-label="Dossier de destination">
      <li>
        <label class="choice" [class.is-current]="currentFolderId() === null">
          <input
            type="radio"
            name="destination"
            class="visually-hidden"
            [disabled]="currentFolderId() === null"
            [checked]="choice() === null"
            (change)="choice.set(null)"
          />
          <app-icon name="folder" [size]="15" />{{ rootName() }}
          @if (currentFolderId() === null) {
            <span class="meta">(emplacement actuel)</span>
          }
          @if (choice() === null) {
            <app-icon class="check" name="check" [size]="15" />
          }
        </label>
      </li>
      @for (entry of tree(); track entry.folder.id) {
        <li>
          <label
            class="choice"
            [class.is-current]="currentFolderId() === entry.folder.id"
            [style.padding-left.rem]="0.5 + 1.125 * (entry.depth + 1)"
          >
            <input
              type="radio"
              name="destination"
              class="visually-hidden"
              [disabled]="currentFolderId() === entry.folder.id"
              [checked]="choice() === entry.folder.id"
              (change)="choice.set(entry.folder.id)"
            />
            <app-icon name="folder" [size]="15" />{{ entry.folder.name }}
            @if (currentFolderId() === entry.folder.id) {
              <span class="meta">(emplacement actuel)</span>
            }
            @if (choice() === entry.folder.id) {
              <app-icon class="check" name="check" [size]="15" />
            }
          </label>
        </li>
      }
    </ul>
  </div>

  <div class="modal-footer">
    <button type="button" class="button" (click)="close()">Annuler</button>
    <button
      type="button"
      class="button button-primary"
      [disabled]="choice() === undefined"
      (click)="confirm()"
    >
      Déplacer ici
    </button>
  </div>
</dialog>
