<main class="login">
  <h1>Espace d’études</h1>

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="field">
      <label for="username">Identifiant</label>
      <input
        id="username"
        type="text"
        formControlName="username"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        [attr.aria-invalid]="form.controls.username.touched && form.controls.username.invalid"
        [attr.aria-describedby]="
          form.controls.username.touched && form.controls.username.invalid ? 'username-error' : null
        "
      />
      @if (form.controls.username.touched && form.controls.username.invalid) {
        <p id="username-error" class="field-error">L’identifiant est requis.</p>
      }
    </div>

    <div class="field">
      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
        [attr.aria-describedby]="
          form.controls.password.touched && form.controls.password.invalid ? 'password-error' : null
        "
      />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <p id="password-error" class="field-error">Le mot de passe est requis.</p>
      }
    </div>

    <div role="alert">
      @for (error of errors(); track error) {
        <p class="form-error">{{ error }}</p>
      }
    </div>

    <button type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Connexion…' : 'Se connecter' }}
    </button>
  </form>
</main>
