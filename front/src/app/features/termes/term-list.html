<ul class="term-list">
  @for (term of terms(); track term.id) {
    <li>
      <a class="card term" [routerLink]="[screens[term.type].path, term.id]">
        <span class="term-label">{{ term.label }}</span>
        @if (term.expandedForm) {
          <span class="term-expanded">{{ term.expandedForm }}</span>
        }
        @if (term.excerpt) {
          <span class="term-excerpt">{{ term.excerpt }}</span>
        }
      </a>
    </li>
  }
</ul>
