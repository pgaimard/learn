<a class="skip-link" href="#contenu">Aller au contenu</a>

<header class="header">
  <div class="header-inner">
    <a class="brand" routerLink="/">Espace d’études</a>

    <nav class="main-nav" aria-label="Navigation principale">
      <a routerLink="/dictionnaire" routerLinkActive="is-active" ariaCurrentWhenActive="page">
        Dictionnaire
      </a>
      <a routerLink="/glossaire" routerLinkActive="is-active" ariaCurrentWhenActive="page">
        Glossaire
      </a>
    </nav>

    <app-search-box />

    <div class="account">
      <app-term-quick-create />
      @if (user(); as currentUser) {
        <span class="username">{{ currentUser.username }}</span>
      }
      <button type="button" class="button logout" [disabled]="isLoggingOut()" (click)="logout()">
        Se déconnecter
      </button>
    </div>
  </div>
</header>

<main id="contenu" class="content" tabindex="-1">
  <router-outlet />
</main>
