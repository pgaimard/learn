<a class="skip-link" href="#contenu">Aller au contenu</a>

<header class="header">
  <a class="brand" routerLink="/"
    ><span class="brand-mark" aria-hidden="true"></span>Espace d’études</a
  >

  <nav class="main-nav" aria-label="Navigation principale">
    <a
      routerLink="/"
      routerLinkActive="is-active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      [class.is-current-section]="isInUe()"
    >
      Mes UE
    </a>
    <a routerLink="/outils" routerLinkActive="is-active" ariaCurrentWhenActive="page"> Outils </a>
    <a routerLink="/agenda" routerLinkActive="is-active" ariaCurrentWhenActive="page"> Agenda </a>
    <a routerLink="/taches" routerLinkActive="is-active" ariaCurrentWhenActive="page">
      Tâches<app-task-reminder-badge />
    </a>
  </nav>

  <app-search-box />

  @if (user(); as currentUser) {
    <div class="account">
      <button
        #accountButton
        type="button"
        class="avatar"
        aria-haspopup="menu"
        [attr.aria-expanded]="isAccountOpen()"
        [attr.aria-label]="'Compte ' + currentUser.username"
        (click)="isAccountOpen.set(!isAccountOpen())"
      >
        {{ initials() }}
      </button>
      @if (isAccountOpen()) {
        <div class="account-menu" role="menu" aria-label="Compte">
          <p class="account-name">{{ currentUser.username }}</p>
          <app-segmented
            class="account-theme"
            label="Thème"
            [options]="themeOptions"
            [value]="themeChoice()"
            (valueChange)="chooseTheme($event)"
          />
          <a
            routerLink="/administration"
            role="menuitem"
            class="account-item"
            (click)="isAccountOpen.set(false)"
          >
            <app-icon name="sliders" [size]="15" />Administration
          </a>
          <button
            type="button"
            role="menuitem"
            class="account-item"
            [disabled]="isLoggingOut()"
            (click)="logout()"
          >
            <app-icon name="logout" [size]="15" />Se déconnecter
          </button>
        </div>
      }
    </div>
  }
</header>

<main id="contenu" class="content" tabindex="-1">
  <router-outlet />
</main>
